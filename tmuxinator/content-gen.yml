# ~/.tmuxinator/content-gen.yml

name: content-gen
root: <%= ENV['UNISPORKAL'] %>/federated-components/content-gen

windows:
  - aarp:
      layout: even-horizontal
      panes:
        - nvim:
            - nvim
        - term:
            - echo "💡 Empty Terminal"
  - servers:
      layout: even-horizontal
      panes:
        - webpack:
            - echo "💡 Run 'giw' or 'pnpm dev' here"
        - test:
            - echo "💡 run 'pnpm jest' here"
