# ~/.tmuxinator/account.yml

name: account
root: <%= ENV['UNISPORKAL'] %>/account

windows:
  - account:
      layout: even-horizontal
      panes:
        - nvim:
            - nvim
        - term:
  - servers:
      layout: even-horizontal
      panes:
        - webpacker:
            - echo "💡 Run 'npm run dev' or 'pnpm dev' here"
        - railsserver:
            - echo "💡 Run 'rails s' here"
