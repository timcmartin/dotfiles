# ~/.tmuxinator/checkout.yml

name: checkout
root: <%= ENV['UNISPORKAL'] %>/federated-components/checkout

windows:
  - checkout:
      layout: even-horizontal
      panes:
        - nvim:
            - nvim
        - term:
  - checkout-server:
      layout: even-horizontal
      panes:
        - copilot:
        - pnpm:
            - echo "💡 Run 'pnpm dev' here"
