# ~/.tmuxinator/cns.yml

name: cns
root: <%= ENV['UNISPORKAL'] %>/federated-components/customer-notifications

windows:
  - cns:
      layout: even-horizontal
      panes:
        - nvim:
            - nvim
        - term:
  - cns-server:
      layout: even-horizontal
      panes:
        - dynamodb:
            - echo "💡 Run 'colima start' here, then 'gidynamodb-admin'"
        - pnpm:
            - echo "💡 Run 'pnpm dev' here"
        - ruby:
            - echo "💡 Run pnpm ruby here"
