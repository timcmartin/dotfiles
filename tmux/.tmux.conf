# Legacy: Herdr is the preferred multiplexer. This config is for when Herdr isn't in use.
set -g history-limit 20000

# Powerkit
source-file "$HOME/.dotfiles/tmux/tmux-theme-powerkit"

# zsh is kinda tight
set-option -g default-shell $SHELL
# Pin default-command so tmux-sensible doesn't auto-wire reattach-to-user-namespace
# (obsolete since macOS 10.11 El Capitan)
set -g default-command "$SHELL"

# visual aid for window activity
setw -g automatic-rename off
set-option -g allow-rename off
setw -g monitor-activity off
set -g visual-activity off

# act like GNU screen
unbind C-b
set -g prefix C-a

# speed up the tmux command delay
set -sg escape-time 1

# start window indexes at 1
set -g base-index 1
# renumber all windows when any window is closed
set -g renumber-windows on

# used to reload the conf file
bind-key r source-file ~/.tmux.conf

# Fuzzy session switcher with fzf (prefix + Shift-s)
bind-key S display-popup -E "tmux list-sessions -F '#{session_name}' | /opt/homebrew/bin/fzf --reverse | xargs tmux switch-client -t"

# send command through by pressing prefix twice
bind C-a send-prefix

unbind %
bind | split-window -h
bind - split-window -v

# act like vim
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

## Use vim keybindings in copy mode
# Enter copy mode with <prefix>+Escape.
# Navigate the copy mode with vi-like-key bindings (u for up, d for down, etc.)
# Hit v to start copying.
# Press y or Enter (or release a mouse drag) to copy to the system clipboard. This cancels copy mode.
# y and mouse-drag copy come from tmux-yank.
# Paste the tmux buffer with <prefix>+P (make sure that it’s uppercase P).
unbind [
bind Escape copy-mode
set-option -g mouse on
set-option -s set-clipboard off
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'

# cycle through the windows
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# resize panes
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# Restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '60'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fabioluciano/tmux-powerkit'

# Binding of Caller
bind [ send-keys 'caller.reject {|x| x["vendor/bundle"] || x["/.rbenv/versions/"] }' Enter

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
